name: Build Applesauce Legacy for iOS 12

on:
  workflow_dispatch:
  push:
    paths:
      - "platform/ios/**"
      - "platform/ios12/**"
      - ".github/workflows/build-ios12-chimera.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select build tools
        run: |
          set -eux
          xcodebuild -version
          rustup target add aarch64-apple-ios
          brew install cmake ninja boost ldid

      - name: Build SDL, HyperHLE and iOS host
        run: |
          set -eux
          export TOUCHHLE_BOOST_ROOT="$(brew --prefix boost)/include"
          git -C vendor/dynarmic apply \
            ../../platform/ios12/dynarmic-permanent-jit.patch
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos
          sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package for Chimera and AppSync Unified
        run: |
          set -eux
          sh platform/ios/scripts/package-ipa.sh --chimera
          sh platform/ios/scripts/verify-ipa.sh \
            --chimera \
            dist/ApplesauceLegacy-iOS12-Chimera.ipa

      - name: Upload game-free package
        uses: actions/upload-artifact@v4
        with:
          name: ApplesauceLegacy-iOS12-Chimera
          path: |
            dist/ApplesauceLegacy-iOS12-Chimera.ipa
            dist/ApplesauceLegacy-iOS12-Chimera.ipa.sha256
          if-no-files-found: error
